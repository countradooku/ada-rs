[package]
name = "ada-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["ada-rs contributors"]
description = "A memory-safe, high-performance WHATWG URL parser in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/countradooku/ada-rs"
keywords = ["url", "whatwg", "parser", "simd", "idna"]
categories = ["parser-implementations", "web-programming", "encoding"]

[lib]
name = "ada_rs"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["servo-url/std"]
serde = ["dep:serde"]
url-pattern = ["dep:urlpattern"]
bench-ada = ["dep:ada-url-ffi"]

[dependencies]
ada-url-ffi = { package = "ada-url", version = "4.0.0", optional = true }
idna = "1.1.0"
memchr = "2.8.3"
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"], optional = true }
servo-url = { package = "url", version = "2.5.8", default-features = false }
urlpattern = { version = "0.6.0", optional = true }

[dev-dependencies]
divan = "0.1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "parse"
harness = false
required-features = ["bench-ada"]

[[bench]]
name = "wpt"
harness = false
required-features = ["bench-ada"]

[[example]]
name = "wpt-profile"
required-features = ["bench-ada"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.bench]
codegen-units = 1
debug = false
inherits = "release"
lto = "fat"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
